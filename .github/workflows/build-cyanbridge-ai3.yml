name: Build patched CyanBridge for AI3

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "cyanbridge-patch/**"
      - ".github/workflows/build-cyanbridge-ai3.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout AI3 bridge repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Clone pinned CyanBridge upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/FerSaiyan/Alternative-HeyCyan-App-and-SDK.git upstream
          cd upstream
          git checkout d7e726e923943b94ae32cd1e42c20b3ee6343bd7
          git submodule update --init --recursive

      - name: Apply AI3 persistence patch
        run: python3 cyanbridge-patch/apply_patch.py

      - name: Build patched CyanBridge debug APK
        working-directory: upstream/android/CyanBridge
        env:
          META_GITHUB_TOKEN: ""
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload patched CyanBridge
        uses: actions/upload-artifact@v4
        with:
          name: cyanbridge-ai3-persistent-debug
          path: upstream/android/CyanBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
